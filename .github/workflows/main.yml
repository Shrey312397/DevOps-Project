name: My First CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir build
          echo "My DevOps application build" > build/app.txt

      - name: Test
        run: |
          test -f build/app.txt
          echo "Test passed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-build-artifact
          path: build/
